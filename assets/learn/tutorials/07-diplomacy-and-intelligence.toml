# OpenSE4's own lesson (docs/LEARNING.md). Written from docs/spec and the client.
title = "Diplomacy and intelligence"
summary = "Meet your neighbours, propose a treaty, read their answer and start your first intelligence project."
minutes = 20
learned = [
    "Exploring until you meet another empire",
    "Reading the Empires window: treaties and moods",
    "Proposing a treaty, and reading the answer in the Log",
    "Starting an intelligence project",
]
# The last lesson: its result offers the first training game.
suggest = "training:land-rush"

[setup]
seed = 11
computer_players = 3
systems = 6
events = "none"
# OpenSE4 lesson extension (docs/LEARNING.md): ships to learn with. A normal game starts with none.
starting_ships = ["Attack Ship", "Attack Ship"]

[[step]]
title = "Neighbours"
text = """
**Three other empires live close by** in this small, crowded quadrant. In this lesson you meet
them, talk to them and start an intelligence project.

You make **contact** with an empire when your ships and theirs are in the same system and see
each other. Press **Next**.
"""
highlight = ["lesson:panel"]
manual = "diplomacy#meeting-other-empires"

[[step]]
title = "Send out an explorer"
text = """
**Select an attack ship with the ship arrows** (or `Space`), **then press Explore** (`E`).

This lesson's game gives you two attack ships to explore with.
"""
highlight = ["cycle:ship", "order:explore"]
allow = ["panel:report"]
done = { order = "explore", design_type = "Attack Ship" }
manual = "galaxy#exploring"

[[step]]
title = "A second explorer"
text = """
**Select your other attack ship and press Explore too.**

Two explorers find your neighbours twice as fast, and never pick the same warp point.
"""
highlight = ["cycle:ship", "order:explore"]
allow = ["panel:report"]
done = { order = "explore", design_type = "Attack Ship" }
manual = "galaxy#exploring"

[[step]]
title = "First contact"
text = """
**Press End Turn and Yes until you meet another empire**: the Log then reports a **first
contact**. Close the Log (`Esc`) before each End Turn.

When a ship has arrived, select it and press **Explore** again. Your neighbours' ships may find
you first.
"""
highlight = ["button:end-turn", "order:explore", "cycle:ship"]
allow = ["panel:report", "log:close"]
done = { empires_met = 1 }
progress = ["turns_passed"]
manual = "diplomacy#meeting-other-empires"

[[step]]
title = "The Empires window"
text = """
**Open the Empires window** with its command button (the alien face) or `F9`.

You have met a neighbour, and this window shows every empire you know.
"""
highlight = ["command:empires"]
done = { window = "empires" }
manual = "diplomacy#the-empires-window"

[[step]]
title = "The empires you know"
text = """
**Each empire you have met has a portrait and a column of facts**: your treaty with it, who plays
it, and a computer player's **mood** toward you, from Brotherly to Murderous.

Without a treaty of **Non-Aggression** or better, your ships fight on sight. The tabs show the
**Trade** and **Tariff** columns. Press **Next**.
"""
highlight = ["empires:list", "empires:treaty", "empires:trade", "empires:tariff"]
allow = ["empires:treaty", "empires:trade", "empires:tariff"]
manual = "diplomacy#treaties"

[[step]]
title = "Open a channel"
text = """
**Click a portrait** to open the **Communicate** window with that empire.

A right-click on a portrait shows that race's report instead.
"""
highlight = ["empires:list"]
done = { window = "communicate" }
manual = "diplomacy#the-communicate-window"

[[step]]
title = "Propose a treaty"
text = """
**Choose Propose Treaty in the Message Type list**, then Non-Aggression in the Treaty list under
it, if another treaty shows.

Non-Aggression means your ships no longer fight on sight.
"""
highlight = ["communicate:message-type", "communicate:message-type:propose-treaty", "communicate:treaty", "communicate:treaty:non-aggression"]
done = { all = [{ draft_message_type = "propose-treaty" }, { draft_treaty = "non-aggression" }] }
manual = "diplomacy#messages"

[[step]]
title = "Send it"
text = """
**Press Send Message.** Pick a tone and edit the text first if you like.

You can send each empire one message a turn. The computer player reads it in its own turn.
"""
highlight = ["communicate:send"]
allow = ["communicate:tone", "communicate:text"]
show = ["communicate:message-type", "communicate:treaty"]
done = { command = "SendMessage", message_type = "propose-treaty", message_treaty = "non-aggression" }
manual = "diplomacy#messages"

[[step]]
title = "Wait for the answer"
text = """
**Close the Empires window (`Esc`), then press End Turn** and **Yes**.

The computer player answers during its turn, and its answer waits for you in the Log.
"""
highlight = ["button:end-turn"]
done = { turns_passed = 1 }
manual = "diplomacy#how-computer-players-feel-about-you"

[[step]]
title = "Politics"
text = """
**The Log opened by itself at the new turn.** Click its **Politics** category to see only the
messages of other empires (it is dim when nobody wrote), then select a message to read it.
**Send Reply** answers one. (`F10` opens the Log again.)

Press **Next** when you have read the answer.
"""
highlight = ["log:politics", "log:send-reply"]
allow = ["log:politics", "log:messages"]
show = ["log:details"]
manual = "diplomacy#messages"

[[step]]
title = "A treaty"
text = """
**End turns until a treaty is signed**; after three turns the lesson goes on anyway. Close the
Log (`Esc`) before each End Turn.

A computer player accepts only when its anger toward you is low. Another time, when one refuses,
propose again a few turns later, or send a **Gift** first.
"""
highlight = ["button:end-turn"]
allow = ["log:close"]
done = { any = [{ treaty = "non-aggression" }, { treaties = 1 }, { turns_passed = 3 }] }
manual = "diplomacy#how-computer-players-feel-about-you"

[[step]]
title = "The Empires window again"
text = """
**Open the Empires window** again, with its command button or `F9`.
"""
highlight = ["command:empires"]
done = { window = "empires" }
manual = "diplomacy#the-empires-window"

[[step]]
title = "More about other empires"
text = """
**The buttons on the right open more reports**: the **Treaty Grid** of who is at peace with whom,
the **Scores**, this game's **Victory Conditions**, and your own race report under **Our Race**.

Open them to look, closing each with `Esc`, then press **Next**.
"""
highlight = ["empires:treaty-grid", "empires:scores", "empires:victory-conditions", "empires:our-race"]
allow = ["empires:treaty-grid", "empires:scores", "empires:victory-conditions", "empires:our-race"]
manual = "diplomacy#the-empires-window"

[[step]]
title = "Intelligence"
text = """
**Press Intelligence** in the Empires window.

Intelligence projects spy on other empires and sabotage them, and protect you from their agents.
"""
highlight = ["empires:intelligence"]
done = { window = "intelligence" }
manual = "intelligence#the-intelligence-window"

[[step]]
title = "A first project"
text = """
**Click a defense project** in the list to add it: it stores up points and stops enemy projects
aimed at you.

Your intelligence points come from intelligence facilities, which you build like any other
facility. Without them the project waits.
"""
highlight = ["intelligence:projects", "intelligence:projects:defense"]
done = { command = "SetIntel" }
manual = "intelligence#defense-projects"

[[step]]
title = "Well done"
text = """
**You met a neighbour, proposed a treaty and started an intelligence project.**

Sign Non-Aggression with neighbours you are not ready to fight, trade treaties for free income,
and keep a defense project running once a neighbour turns hostile. Press **Finish**.
"""
highlight = ["lesson:panel"]
manual = "diplomacy#diplomacy-advice"
