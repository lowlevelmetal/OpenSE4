[mod]
id = "opense4.hegemon"
name = "Hegemon"
version = "0.1.0"
api = 1
authors = ["OpenSE4 contributors"]
description = "A computer player with its own strategy, economy planner, ship designer, operations and tactics."

[[ai.players]]
name = "Hegemon"
module = "hegemon"
class = "Hegemon"
description = "Plans its own expansion, research, designs, wars and battles, and remembers what it has seen."
# Hegemon makes every decision itself and never asks ai.builtin: the classic AI's
# bookkeeping for its empire is not needed (docs/sdk/ai-protocol.md, section 9).
classic_state = false
