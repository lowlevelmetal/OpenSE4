# OpenSE4's own lesson (docs/LEARNING.md). Written from docs/spec and the client.
title = "Diplomacy and intelligence"
summary = "Meet your neighbours, propose a treaty, read their answer and start your first intelligence project."
minutes = 20

[setup]
seed = 11
computer_players = 3
systems = 6
events = "none"
# OpenSE4 lesson extension (docs/LEARNING.md): ships to learn with. A normal game starts with none.
starting_ships = ["Attack Ship", "Attack Ship"]

[[step]]
title = "Neighbours"
text = """
This quadrant is small and crowded: three other empires live close by. In this lesson you meet
them, talk to them and start an intelligence project.

First you have to find them. You make **contact** with an empire when your ships and theirs are
in the same system and each side can see the other. Press **Next**.
"""
highlight = ["lesson:panel"]
manual = "diplomacy#meeting-other-empires"

[[step]]
title = "Send out an explorer"
text = """
This lesson's game gives you two attack ships to explore with. Select one with the ship arrows
(or `Space`) and give it the **Explore** order (`E`).
"""
highlight = ["cycle:ship", "order:explore"]
allow = ["panel:report"]
done = { order = "explore" }
manual = "galaxy#exploring"

[[step]]
title = "First contact"
text = """
Send your second attack ship exploring too: select it with the ship arrows and press
**Explore**. Then end turns until you meet another empire: the Log reports a **first contact**.
Give each ship a new Explore order when it arrives. Your neighbours' ships may also find you
first.
"""
highlight = ["button:end-turn", "order:explore", "cycle:ship"]
allow = ["panel:report"]
done = { empires_met = 1 }
manual = "diplomacy#meeting-other-empires"

[[step]]
title = "The Empires window"
text = """
You have met a neighbour. Open the **Empires** window with its command button (the alien face) or
`F9`.
"""
highlight = ["command:empires"]
done = { window = "empires" }
manual = "diplomacy#the-empires-window"

[[step]]
title = "The empires you know"
text = """
Each empire you have met has a portrait and a column of facts: your **treaty** with it, whether a
human or the computer plays it, and for computer players their **mood** toward you, from
Brotherly to Murderous.

You start with no treaty, and ships of empires without a treaty of **Non-Aggression** or better
fight on sight. The tabs on the right show other columns: **Trade** and **Tariff**. Press **Next**.
"""
highlight = ["empires:list", "empires:treaty", "empires:trade", "empires:tariff"]
allow = ["empires:treaty", "empires:trade", "empires:tariff"]
manual = "diplomacy#treaties"

[[step]]
title = "Open a channel"
text = """
Left-click a portrait to open the **Communicate** window with that empire. (Right-clicking a
portrait shows its race report.)
"""
highlight = ["empires:list"]
done = { window = "communicate" }
manual = "diplomacy#the-communicate-window"

[[step]]
title = "Propose a treaty"
text = """
Choose **Propose Treaty** as the message type and **Non-Aggression** as the treaty. Pick a tone,
edit the text if you like, and press **Send Message**.

You can send each empire one message per turn. In a turn-based game a message takes effect the
moment it is sent; an answer comes in the other empire's turn.
"""
highlight = ["communicate:message-type", "communicate:treaty", "communicate:send"]
allow = ["window:communicate"]
done = { command = "SendMessage" }
manual = "diplomacy#messages"

[[step]]
title = "Wait for the answer"
text = """
Close the windows and end the turn (**End Turn**, then **Yes**). The computer player answers during its own turn.
"""
highlight = ["button:end-turn"]
done = { turns_passed = 1 }
manual = "diplomacy#how-computer-players-feel-about-you"

[[step]]
title = "Read the answer"
text = """
Open the **Log** (`F10`).
"""
highlight = ["command:log"]
done = { window = "log" }
manual = "turns#the-log"

[[step]]
title = "Politics"
text = """
Messages from other empires are listed under **Politics**: click that category. (It is dim when
nobody wrote to you this turn.) Select a message to read it; **Send Reply** answers it.

Press **Next** when you have read the answer.
"""
highlight = ["log:politics", "log:send-reply"]
allow = ["log:politics", "log:messages"]
manual = "diplomacy#messages"

[[step]]
title = "A treaty"
text = """
If they accepted, you now hold a treaty of **Non-Aggression**, and your ships no longer fight.

A computer player accepts a treaty only when its anger toward you is low enough. If it refused,
propose again in a later turn, or soften it with a **Gift** first. End turns until a treaty is
signed; after three turns the lesson goes on anyway.
"""
highlight = ["command:empires", "button:end-turn"]
done = { any = [{ treaty = "non-aggression" }, { treaties = 1 }, { turns_passed = 3 }] }
manual = "diplomacy#how-computer-players-feel-about-you"

[[step]]
title = "More about other empires"
text = """
The Empires window has more on its right side: the **Treaty Grid** of who is at peace with whom,
the **Scores**, the **Victory Conditions** of this game, and your own race report under **Our
Race**. Open it with its command button to look, then press **Next**.
"""
highlight = ["command:empires"]
allow = ["command:empires"]
manual = "diplomacy#the-empires-window"

[[step]]
title = "Intelligence"
text = """
Open the Empires window again and press **Intelligence**. Intelligence projects let you spy on
other empires and sabotage them, and protect you from their agents.
"""
highlight = ["command:empires", "empires:intelligence"]
done = { window = "intelligence" }
manual = "intelligence#the-intelligence-window"

[[step]]
title = "A first project"
text = """
The list shows the projects your technology allows, under their groups. Click a **defense** project
to add it: it stores points in your queue and stops enemy projects aimed at you.

Your intelligence points come from intelligence facilities, which you build like any other
facility. Without them the project waits.
"""
highlight = ["window:intelligence"]
done = { command = "SetIntel" }
manual = "intelligence#defense-projects"

[[step]]
title = "Well done"
text = """
You have met a neighbour, proposed a treaty and started an intelligence project.

A few tips: sign Non-Aggression with neighbours you are not ready to fight, sign trade treaties
for free income, and keep a small defense project running once a neighbour turns hostile. Press
**Finish** to end the lesson.
"""
highlight = ["lesson:panel"]
manual = "diplomacy#diplomacy-advice"
