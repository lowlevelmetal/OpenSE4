# Ship components.
#   tonnage     space used in the hull (kT)
#   structure   hit points added to the ship
#   abilities   list of { type, amount, param } - see AbilityType in src/sim/content.hpp
#               types: movement, command, life_support, crew_quarters, supply_storage,
#                      cargo_storage, colonize (param = surface), sensor, shield_generation
#   weapon      { damage, range } for weapons

[[component]]
key = "bridge"
name = "Bridge"
description = "Command center. Every ship needs one."
tonnage = 10
structure = 10
cost = { minerals = 20 }
abilities = [{ type = "command", amount = 1 }]
requires = { ship_construction = 1 }

[[component]]
key = "life_support"
name = "Life Support"
description = "Keeps the crew alive."
tonnage = 10
structure = 10
cost = { minerals = 10, organics = 10 }
abilities = [{ type = "life_support", amount = 1 }]

[[component]]
key = "crew_quarters"
name = "Crew Quarters"
description = "Living space for the crew."
tonnage = 10
structure = 10
cost = { minerals = 10, organics = 10 }
abilities = [{ type = "crew_quarters", amount = 1 }]

[[component]]
key = "ion_engine"
name = "Ion Engine"
description = "Standard sublight engine."
tonnage = 10
structure = 10
cost = { minerals = 20, radioactives = 10 }
abilities = [{ type = "movement", amount = 1 }]
requires = { propulsion = 1 }

[[component]]
key = "fusion_engine"
name = "Fusion Engine"
description = "Twice the thrust of an ion engine."
tonnage = 10
structure = 12
cost = { minerals = 30, radioactives = 25 }
abilities = [{ type = "movement", amount = 2 }]
requires = { propulsion = 3 }

[[component]]
key = "supply_storage"
name = "Supply Storage"
description = "Fuel and consumables for long voyages."
tonnage = 10
structure = 5
cost = { minerals = 10 }
abilities = [{ type = "supply_storage", amount = 500 }]

[[component]]
key = "cargo_bay"
name = "Cargo Bay"
description = "General-purpose cargo space."
tonnage = 20
structure = 10
cost = { minerals = 20 }
abilities = [{ type = "cargo_storage", amount = 50 }]

[[component]]
key = "sensor_array"
