# Starting ship designs, given to every empire.
#   role        scout | colony | warship  (used by the computer players)
#   components  component keys; "{colony_module}" is replaced by the race's colony component

[[design]]
name = "Scout"
role = "scout"
hull = "escort"
components = [
    "bridge", "life_support", "crew_quarters",
    "ion_engine", "ion_engine", "ion_engine", "ion_engine",
    "supply_storage",
]

[[design]]
name = "Colony Ship"
role = "colony"
hull = "transport"
components = [
    "bridge", "life_support", "crew_quarters",
    "ion_engine", "ion_engine", "ion_engine", "ion_engine",
    "{colony_module}",
]

[[design]]
name = "Frigate"
role = "warship"
hull = "frigate"
components = [
    "bridge", "life_support", "crew_quarters",
    "ion_engine", "ion_engine", "ion_engine",
    "laser_cannon", "laser_cannon",
    "armor_plating", "armor_plating",
    "supply_storage",
]
