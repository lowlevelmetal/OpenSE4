# OpenSE4's own lesson (docs/LEARNING.md). Written from docs/spec and the client.
title = "Combat"
summary = "Fight a test battle in the Combat Simulator: move, fire, use Auto, then watch a strategic battle."
minutes = 20

[setup]
seed = 404
computer_players = 2
quadrant_size = "small"
events = "none"

[[step]]
title = "Battles"
text = """
Ships fight when they meet an empire they are hostile to: at war, or with no treaty of
Non-Aggression or better. In a turn-based game you choose to fight each battle yourself
(**Tactical**) or to let your ships follow their strategies (**Strategic**).

In this lesson you fight a test battle in the **Combat Simulator**, where nothing is really lost.
"""
highlight = ["lesson:panel"]
manual = "combat#when-battles-happen"

[[step]]
title = "Open the simulator"
text = """
Open the **Designs** window (`F3`) and press **Simulator**.
"""
highlight = ["command:designs", "designs:simulator"]
done = { window = "combat-simulator" }
manual = "combat-windows#the-combat-simulator"

[[step]]
title = "Set up the sides"
text = """
The simulator fights between ten imaginary races. **Race 1** is yours to command; the computer
plays the others.

1. In **Owner For Item** at the bottom right, choose **Race 1**. Then click your **Escort** design
   in the **Items** list twice: two escorts join your side, one row each in **Combat Vehicles**
   on the left.
2. Choose **Race 2** and click the **Defense Base** design, to give the other side something to
   defend.

Clicking a row in Combat Vehicles removes it, and right-clicking an item shows its report. The
lesson goes on when both races have their items.
"""
highlight = ["combat-simulator:owners", "combat-simulator:items", "combat-simulator:vehicles"]
done = { all = [{ simulator_owners = 2 }, { simulator_items = 3 }] }
manual = "combat-windows#the-combat-simulator"

[[step]]
title = "Begin"
text = """
Make sure the **Tactical** tab on the right is chosen, so that you command Race 1 yourself, and
press **Begin**. The simulator closes while you fight, and comes back afterwards.
"""
highlight = ["combat-simulator:tactical", "combat-simulator:begin"]
done = { window = "tactical-combat" }
manual = "combat-windows#tactical-combat"

[[step]]
title = "The battlefield"
text = """
This is the **Tactical Combat** window. Your ships start on one edge of the map, the base in the
middle. The status bar at the top shows the combat turn and whose phase it is; the panels show
your selected ship, its shields, damage, movement and weapons.

Press **Begin** at the bottom right to start the battle. Then press **Next** here.
"""
highlight = ["tactical-combat:end-turn", "tactical-combat:map"]
manual = "combat-windows#tactical-combat"

[[step]]
title = "Move"
text = """
Click one of your ships to select it, then click an empty square to move it there. A ship moves
half its normal speed each combat turn.

The chance to hit falls by 10 points for every square of distance, so get close. Press **Next**.
"""
highlight = ["tactical-combat:map", "tactical-combat:piece"]
manual = "combat#movement-in-combat"

[[step]]
title = "Fire"
text = """
Point at the enemy: the pointer shows whether your ship can fire at it. Hover over a weapon in
the ship's weapon list to see its chance to hit and its damage. Click the enemy to fire every
ticked weapon.

Shields absorb damage first, then armor is destroyed, then everything else. Press **Next**.
"""
highlight = ["tactical-combat:weapons", "tactical-combat:target"]
manual = "combat#hitting-the-target"

[[step]]
title = "End the phase"
text = """
When your ships have moved and fired, press **End Turn** (or `E`) to end your phase. The other
side then acts, and a new combat turn begins.

**Auto** lets every side follow its strategies; press it again to take control back. Play on
until the battle ends: **Combat Complete** appears, and after **OK** the window closes by itself
and the simulator comes back.
"""
highlight = ["tactical-combat:end-turn", "tactical-combat:auto"]
done = { not = { window = "tactical-combat" } }
manual = "combat-windows#tactical-combat"

[[step]]
title = "A strategic battle"
text = """
Back in the simulator, choose the **Strategic** tab and press **Begin** again. This time every
ship follows its **strategy**, and you watch.
"""
highlight = ["combat-simulator:strategic", "combat-simulator:begin"]
done = { window = "strategic-combat" }
manual = "combat-windows#strategic-combat"

[[step]]
title = "Watching"
text = """
Press **Begin** in the Strategic Combat window. The battle is then fought while you watch, and
the forces list on the left shows what each side has and has lost. **Close** lights up when
the battle is over: press it then.
"""
highlight = ["window:strategic-combat"]
done = { not = { window = "strategic-combat" } }
manual = "combat-windows#strategic-combat"

[[step]]
title = "Strategies"
text = """
How a ship fights on its own depends on its **strategy**: where it moves, what it shoots first,
and when it leaves its formation. Press **Strategies** in the simulator (it also opens from
**Empire Status**, `F11`).
"""
highlight = ["combat-simulator:strategies"]
done = { window = "strategies" }
manual = "combat#strategies"

[[step]]
title = "Well done"
text = """
Each design has a default strategy, and a fleet's own strategy overrides it. Look through the
pages of the window to see what a strategy can say.

Remember: use the simulator to test a new design against the enemy designs you have seen before
you build a fleet of it.
"""
highlight = ["window:strategies"]
manual = "combat#strategies"
