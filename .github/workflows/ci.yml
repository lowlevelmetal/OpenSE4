# Builds and tests OpenSE4 on Linux, macOS and Windows (docs/BUILDING.md,
# "Continuous integration"). Nothing here needs the original game: the tests
# that read an installed copy are opt-in (OPENSE4_CLASSIC_DATA) and stay off,
# and the input scripts that CI plays run on our own test fixtures.
#
# Third-party actions are pinned to a full commit SHA; the comment names the tag.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux:
    name: Linux / ${{ matrix.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC debug
            preset: debug
            cc: gcc
            cxx: g++
          - name: Clang debug
            preset: debug
            cc: clang
            cxx: clang++
          # Only the tests: the slow sanitized build of the rest would check
          # nothing the other jobs do not.
          - name: GCC ASan+UBSan
            preset: asan
            cc: gcc
            cxx: g++
            target: opense4_tests
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CMake and Ninja come with the image. SDL3, glslc and the Vulkan headers
      # are the distribution's packages (docs/BUILDING.md, "Linux").
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslc libsdl3-dev libvulkan-dev ccache
          cmake --version | head -1
          "$CXX" --version | head -1

      - name: Restore the compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: linux-${{ matrix.cc }}-${{ matrix.preset }}
          max-size: 1G
          evict-old-files: job

      - name: Restore the FetchContent sources
        id: deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: |
          cmake -DDIR=.deps -P .github/scripts/fetchcontent_cache.cmake
          cmake --preset ${{ matrix.preset }} -C .deps/sources.cmake \
            -DOPENSE4_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Keep the FetchContent sources for the next run
        if: steps.deps.outputs.cache-hit != 'true'
        run: cmake -DDIR=.deps -DBUILD=build/${{ matrix.preset }} -P .github/scripts/fetchcontent_cache.cmake

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }} -- -k 0

      # In four processes at once (one per core): under the sanitizers the tests
      # take a quarter of an hour one after another.
      - name: Unit tests
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: .github/scripts/run_tests_parallel.sh build/${{ matrix.preset }}/tests/opense4_tests 4

      - name: Start the programs
        if: ${{ !matrix.target }}
        run: |
          build/${{ matrix.preset }}/opense4 --help > /dev/null
          build/${{ matrix.preset }}/opense4-server --help > /dev/null

  # 64-bit ARM, natively on GitHub's arm64 runner (docs/BUILDING.md, "ARM Linux"),
  # with the distribution's SDL3. An optimized build: only there may a compiler
  # fuse a multiply and an add, which -ffp-contract=off forbids (docs/ENGINE.md,
  # "Same on every platform"); the debug builds above never do.
  linux-arm64:
    name: Linux arm64 / GCC release
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslc libsdl3-dev libvulkan-dev ccache
          cmake --version | head -1
          "$CXX" --version | head -1

      - name: Restore the compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: linux-arm64-gcc-release
          max-size: 1G
          evict-old-files: job

      # The sources are the same on every architecture: one cache for all Linux jobs.
      - name: Restore the FetchContent sources
        id: deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: |
          cmake -DDIR=.deps -P .github/scripts/fetchcontent_cache.cmake
          cmake --preset release -C .deps/sources.cmake \
            -DOPENSE4_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Keep the FetchContent sources for the next run
        if: steps.deps.outputs.cache-hit != 'true'
        run: cmake -DDIR=.deps -DBUILD=build/release -P .github/scripts/fetchcontent_cache.cmake

      - name: Build
        run: cmake --build --preset release -- -k 0

      - name: Unit tests
        run: .github/scripts/run_tests_parallel.sh build/release/tests/opense4_tests 4

      - name: Start the programs
        run: |
          build/release/opense4 --help > /dev/null
          build/release/opense4-server --help > /dev/null

  # 32-bit ARM (armhf: ARMv7, hard-float, NEON), cross-compiled on x86_64 with
  # Ubuntu's arm-linux-gnueabihf GCC and the toolchain file of the
  # dist-linux-armhf preset, warnings as errors. The tests run under QEMU's user
  # mode: GitHub's arm64 runners cannot all run 32-bit ARM code. Optimized, as
  # above, and much faster under QEMU than a debug build. SDL3 is built without
  # windows (the tests open none); the release workflow builds it complete.
  linux-armhf:
    name: Linux armhf / GCC release (QEMU)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the cross compiler and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-arm-linux-gnueabihf qemu-user glslc ccache
          cmake --version | head -1
          arm-linux-gnueabihf-g++ --version | head -1
          qemu-arm --version | head -1

      - name: Restore the compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: linux-armhf-gcc-release
          max-size: 1G
          evict-old-files: job

      - name: Restore the FetchContent sources
        id: deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: |
          cmake -DDIR=.deps -P .github/scripts/fetchcontent_cache.cmake
          cmake --preset release -B build/armhf -C .deps/sources.cmake \
            --toolchain cmake/toolchains/arm-linux-gnueabihf.cmake \
            -DSDL_UNIX_CONSOLE_BUILD=ON -DOPENSE4_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Keep the FetchContent sources for the next run
        if: steps.deps.outputs.cache-hit != 'true'
        run: cmake -DDIR=.deps -DBUILD=build/armhf -P .github/scripts/fetchcontent_cache.cmake

      - name: Build
        run: cmake --build build/armhf -- -k 0

      # QEMU finds the ARM C library and dynamic loader under -L.
      - name: Unit tests
        run: |
          file build/armhf/tests/opense4_tests
          printf '#!/bin/sh\nexec qemu-arm -L /usr/arm-linux-gnueabihf "%s" "$@"\n' "$PWD/build/armhf/tests/opense4_tests" > "$RUNNER_TEMP/opense4_tests"
          chmod +x "$RUNNER_TEMP/opense4_tests"
          OPENSE4_TEST_RUNNER="qemu-arm -L /usr/arm-linux-gnueabihf" .github/scripts/run_tests_parallel.sh "$RUNNER_TEMP/opense4_tests" 4

      - name: Start the programs
        run: |
          qemu-arm -L /usr/arm-linux-gnueabihf build/armhf/opense4 --help > /dev/null
          qemu-arm -L /usr/arm-linux-gnueabihf build/armhf/opense4-server --help > /dev/null

  # The client itself, played by input scripts (docs/BUILDING.md "Input scripts"): the
  # scripts that need nothing but our own content run on a game folder made from the
  # test fixtures, headless, with Mesa's software OpenGL. The others play the
  # original game, which CI does not have.
  input-scripts:
    name: Linux / input scripts (fixture data)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The build dependencies as above, and Mesa: llvmpipe behind EGL, which SDL's
      # offscreen video driver uses without a display.
      - name: Install the build dependencies and Mesa
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslc libsdl3-dev libvulkan-dev ccache \
            libegl1 libegl-mesa0 libgl1-mesa-dri libgles2

      - name: Restore the compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: linux-gcc-debug
          max-size: 1G
          evict-old-files: job

      - name: Restore the FetchContent sources
        id: deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: |
          cmake -DDIR=.deps -P .github/scripts/fetchcontent_cache.cmake
          cmake --preset debug -C .deps/sources.cmake \
            -DOPENSE4_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Keep the FetchContent sources for the next run
        if: steps.deps.outputs.cache-hit != 'true'
        run: cmake -DDIR=.deps -DBUILD=build/debug -P .github/scripts/fetchcontent_cache.cmake

      - name: Build the client
        # and the dedicated server that some scripts' lobbies join (tools/run_input_tests.py, "# server:")
        run: cmake --build --preset debug --target opense4 opense4-server

      - name: Play the input scripts on the test fixtures
        env:
          SDL_VIDEO_DRIVER: offscreen
          LIBGL_ALWAYS_SOFTWARE: 1
        run: python3 tools/run_input_tests.py --fixture-data --small --renderer=opengl --jobs 4 --output "$RUNNER_TEMP/input-scripts"

      # The pictures show only our own fixtures and content.
      - name: Keep the pictures of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: input-scripts-failure
          path: ${{ runner.temp }}/input-scripts
          if-no-files-found: ignore
          retention-days: 14

  macos:
    name: macOS / Apple Clang debug
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Apple Clang and libc++ come with Xcode, CMake with the image; SDL3, glslc
      # and the Vulkan headers from Homebrew (docs/BUILDING.md, "macOS").
      - name: Install the build dependencies
        run: |
          brew install ninja sdl3 shaderc vulkan-headers
          sw_vers
          xcodebuild -version
          cmake --version | head -1
          c++ --version | head -1

      - name: Restore the compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: macos-debug
          max-size: 1G
          evict-old-files: job

      - name: Restore the FetchContent sources
        id: deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: |
          cmake -DDIR=.deps -P .github/scripts/fetchcontent_cache.cmake
          cmake --preset debug -C .deps/sources.cmake \
            -DOPENSE4_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Keep the FetchContent sources for the next run
        if: steps.deps.outputs.cache-hit != 'true'
        run: cmake -DDIR=.deps -DBUILD=build/debug -P .github/scripts/fetchcontent_cache.cmake

      - name: Build
        run: cmake --build --preset debug -- -k 0

      - name: Unit tests
        run: .github/scripts/run_tests_parallel.sh build/debug/tests/opense4_tests "$(sysctl -n hw.ncpu)"

      - name: Start the programs
        run: |
          build/debug/opense4 --help > /dev/null
          build/debug/opense4-server --help > /dev/null

  windows-msvc:
    name: Windows / MSVC release (${{ matrix.name }})
    runs-on: ${{ matrix.image }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: VS 2022
            image: windows-2022
            vs: '[17.0,18.0)'
            ccache: windows-msvc-release
          - name: VS 2026
            image: windows-2025
            vs: '[18.0,19.0)'
            ccache: windows-msvc2026-release
    defaults:
      run:
        shell: pwsh
    env:
      CC: cl
      CXX: cl
    steps:
      # The files exactly as committed (LF line endings), as on Linux.
      - name: Check out without CRLF conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # glslc (and the Vulkan headers), as for a developer on Windows.
      - name: Install the Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1.6.0
        with:
          vulkan_version: 1.4.357.0
          cache: true
          stripdown: true

      # The environment of the "x64 Native Tools Command Prompt": cl, link and rc on the PATH.
      - name: Set up the MSVC x64 environment
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -version '${{ matrix.vs }}' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'No ${{ matrix.name }} with the C++ tools found' }
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" > nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and $before[$Matches[1]] -ne $Matches[2]) {
              "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          Write-Output "Visual Studio: $vs"

      - name: Restore the compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ matrix.ccache }}
          max-size: 1G
          evict-old-files: job

      - name: Restore the FetchContent sources
        id: deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      # ccache needs the debug information in the object files (/Z7), not in a shared
      # PDB, and cannot cache precompiled headers (SDL uses them).
      # PowerShell splits an unquoted -DNAME=.value at the dot: keep the -D options quoted.
      - name: Configure
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake '-DDIR=.deps' -P .github/scripts/fetchcontent_cache.cmake
          cmake --preset release -C .deps/sources.cmake `
            '-DOPENSE4_WARNINGS_AS_ERRORS=ON' `
            '-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded' '-DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON' `
            '-DCMAKE_C_COMPILER_LAUNCHER=ccache' '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache'

      - name: Keep the FetchContent sources for the next run
        if: steps.deps.outputs.cache-hit != 'true'
        run: cmake '-DDIR=.deps' '-DBUILD=build/release' -P .github/scripts/fetchcontent_cache.cmake

      - name: Build
        run: cmake --build --preset release -- -k 0

      - name: Unit tests
        run: build\release\tests\opense4_tests.exe

      # opense4.exe is a windowed program: wait for it with a time limit, so that
      # a message box fails the step instead of blocking it.
      - name: Start the programs
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          build\release\opense4-server.exe --help | Out-Null
          $p = Start-Process build\release\opense4.exe -ArgumentList '--help' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'opense4.exe --help did not exit' }
          if ($p.ExitCode -ne 0) { throw "opense4.exe --help exited with $($p.ExitCode)" }

  # The Windows release packages, made as tools/package_release.sh makes them for a
  # release: cross-built on Linux with the pinned llvm-mingw for msvcrt.dll
  # (cmake/toolchains/llvm-mingw-x86_64.cmake), so that they run on Windows 7 SP1 to
  # 11 without the Universal C Runtime. The script checks each program's imports
  # against Windows 7 SP1 (tools/check_windows_imports.py) and runs the tests under
  # Wine; the next job installs the package on Windows.
  windows-mingw:
    name: Windows / llvm-mingw package (Windows 7 to 11)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # glslc for the shaders, NSIS for the installer, bsdtar for the zip and Wine
      # for the tests. The toolchain itself comes with the configure step.
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslc nsis libarchive-tools ccache wine wine64
          cmake --version | head -1
          makensis -VERSION
          wine --version

      # llvm-mingw (about 80 MB), fetched and checked against its SHA-256 by the
      # configure step when the cache does not have it.
      - name: Restore the Windows toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_tools/llvm-mingw-*
          key: llvm-mingw-${{ runner.os }}-${{ hashFiles('cmake/toolchains/llvm-mingw-x86_64.cmake') }}

      - name: Restore the compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: windows-llvm-mingw
          max-size: 1G
          evict-old-files: job

      # The release configuration (static, resources built in), as
      # tools/package_release.sh builds it; the settings here stay in its cache.
      # Without precompiled headers (SDL uses them), so that ccache can cache SDL.
      - name: Configure
        run: |
          cmake --preset dist-windows -DOPENSE4_WARNINGS_AS_ERRORS=ON -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          grep -E '^(CMAKE_CXX_COMPILER|LLVM_MINGW_DIR)' build/dist-windows/CMakeCache.txt

      - name: Build, check the imports, test and package
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: tools/package_release.sh windows

      - name: Compiler cache statistics
        run: ccache --show-stats

      - name: Upload the packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opense4-windows
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  windows-installer:
    name: Windows / installer
    needs: windows-mingw
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      INSTALL_DIR: C:\Program Files\OpenSE4
      UNINSTALL_KEY: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\OpenSE4
      SETTINGS_KEY: HKLM:\SOFTWARE\OpenSE4
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opense4-windows
          path: dist

      # Our own test fixtures, for the data checker below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: source
          sparse-checkout: tests/fixtures

      - name: Install silently
        run: |
          $setup = Get-Item dist\*-setup.exe
          Write-Output "Installing $($setup.Name)"
          $p = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The installer exited with $($p.ExitCode)" }

      - name: Check the files, shortcuts and registry entries
        run: |
          $dir = $env:INSTALL_DIR
          Get-ChildItem $dir | Format-Table Name, Length -AutoSize
          foreach ($f in 'opense4.exe', 'opense4-server.exe', 'opense4-datacheck.exe', 'opense4-convert.exe', 'README.md', 'LICENSE',
                         'THIRD_PARTY_NOTICES.txt', 'uninstall.exe') {
            if (-not (Test-Path -LiteralPath (Join-Path $dir $f))) { throw "Not installed: $f" }
          }
          $version = (Get-Item dist\*-setup.exe).Name -replace '^OpenSE4-(.+)-windows-x86_64-setup\.exe$', '$1'
          $u = Get-ItemProperty $env:UNINSTALL_KEY
          $u | Format-List DisplayName, DisplayVersion, Publisher, InstallLocation, UninstallString,
                           QuietUninstallString, DisplayIcon, EstimatedSize
          $expected = @{
            DisplayName = 'OpenSE4'
            DisplayVersion = $version
            InstallLocation = $dir
            UninstallString = "`"$dir\uninstall.exe`""
            QuietUninstallString = "`"$dir\uninstall.exe`" /S"
            DisplayIcon = "$dir\opense4.exe,0"
          }
          foreach ($name in $expected.Keys) {
            if ($u.$name -ne $expected[$name]) { throw "Uninstall entry ${name}: '$($u.$name)', expected '$($expected[$name])'" }
          }
          if (-not ($u.EstimatedSize -gt 0)) { throw 'Uninstall entry EstimatedSize is missing' }
          if ((Get-ItemProperty $env:SETTINGS_KEY).InstallDir -ne $dir) { throw 'InstallDir is not recorded' }
          foreach ($link in "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\OpenSE4.lnk",
                            "$env:PUBLIC\Desktop\OpenSE4.lnk") {
            if (-not (Test-Path -LiteralPath $link)) { throw "No shortcut: $link" }
          }

      # The installed programs start and exit. The game itself needs the original
      # game's data, which CI does not have: --help must print and exit without
      # a message box (a windowed program, so it is waited for with a time limit).
      - name: Start the installed programs
        run: |
          $dir = $env:INSTALL_DIR
          $p = Start-Process "$dir\opense4.exe" -ArgumentList '--help' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'opense4.exe --help did not exit' }
          if ($p.ExitCode -ne 0) { throw "opense4.exe --help exited with $($p.ExitCode)" }

          $out = & "$dir\opense4-server.exe" --help | Out-String
          if ($LASTEXITCODE -ne 0 -or $out -notmatch 'Usage') { throw "opense4-server.exe --help failed ($LASTEXITCODE)" }

          # No data set in an empty folder: reported with exit status 2.
          $empty = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'no-data')
          $out = & "$dir\opense4-datacheck.exe" $empty.FullName 2>&1 | Out-String
          if ($LASTEXITCODE -ne 2 -or $out -notmatch 'No data set found') { throw "opense4-datacheck.exe: $LASTEXITCODE $out" }

          # Our own small data set: read and checked by the release build on Windows.
          $fixture = Join-Path $env:GITHUB_WORKSPACE 'source\tests\fixtures\minimal_dataset'
          $out = & "$dir\opense4-datacheck.exe" $fixture 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $out -notmatch '0 errors') { throw "opense4-datacheck.exe on the fixtures: $LASTEXITCODE $out" }
          exit 0

      - name: Uninstall silently
        run: |
          $dir = $env:INSTALL_DIR
          $p = Start-Process "$dir\uninstall.exe" -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The uninstaller exited with $($p.ExitCode)" }
          # NSIS runs the uninstaller from a copy in %TEMP%: wait for that to finish.
          $deadline = (Get-Date).AddMinutes(2)
          while ((Test-Path -LiteralPath $dir) -or (Test-Path $env:UNINSTALL_KEY)) {
            if ((Get-Date) -gt $deadline) { throw 'The uninstaller did not finish within two minutes' }
            Start-Sleep -Seconds 1
          }

      - name: Check that nothing is left
        run: |
          foreach ($path in $env:INSTALL_DIR, $env:UNINSTALL_KEY, $env:SETTINGS_KEY,
                            "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\OpenSE4.lnk",
                            "$env:PUBLIC\Desktop\OpenSE4.lnk") {
            if (Test-Path -LiteralPath $path) { throw "Left behind: $path" }
          }
