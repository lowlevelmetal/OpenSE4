# Ship hulls.
#   size              tonnage (kT) available for components
#   structure         base hit points, before armor
#   engines_per_move  thrust needed per point of speed (bigger hulls are sluggish)
#   max_engines       maximum number of engine components

[[hull]]
key = "escort"
name = "Escort"
description = "A small, fast hull for scouting and light escort duty."
