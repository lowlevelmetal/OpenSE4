description = "Extends detection range."
tonnage = 10
structure = 5
cost = { minerals = 20, radioactives = 10 }
abilities = [{ type = "sensor", amount = 2 }]
requires = { sensors = 1 }

[[component]]
key = "armor_plating"
name = "Armor Plating"
description = "Dense alloy plates."
tonnage = 20
structure = 30
cost = { minerals = 30 }
requires = { armor = 1 }

[[component]]
key = "composite_armor"
name = "Composite Armor"
description = "Layered armor with much better protection per ton."
tonnage = 20
structure = 50
cost = { minerals = 45, radioactives = 5 }
requires = { armor = 3 }

[[component]]
key = "deflector_shield"
name = "Deflector Shield"
