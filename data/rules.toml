# Core game rules. Every value here is moddable.
#
# Resource amounts are written as inline tables:
#   { minerals = 100, organics = 50, radioactives = 10 }
# Missing resources default to 0.

[galaxy]
default_systems = 40
# System maps are (2 * sector_radius + 1) sectors on a side, star in the middle.
sector_radius = 6

[start]
resources = { minerals = 4000, organics = 2500, radioactives = 1500 }
homeworld_population = 2000  # millions
homeworld_facilities = [
    "space_yard",
    "mineral_miner", "mineral_miner",
    "organics_farm",
    "radioactives_extractor",
    "research_lab", "research_lab",
]
# Tech levels every empire starts with (races may add bonus techs).
techs = { physics = 1, propulsion = 1, ship_construction = 1, armor = 1, energy_weapons = 1 }
ships = [
    { design = "Scout", count = 2 },
    { design = "Colony Ship", count = 1 },
    { design = "Frigate", count = 1 },
]

[population]
colony_start = 100          # millions landed by a colony ship
growth_percent = 5          # per turn, until the planet's maximum
hostile_atmosphere_percent = 25  # max population on a planet whose air the race can't breathe
max_by_size = { tiny = 500, small = 1000, medium = 2000, large = 3000, huge = 4000 }
facility_slots = { tiny = 3, small = 5, medium = 8, large = 11, huge = 14 }

[construction]
# Colonies without a space yard can still build facilities at this rate
# (per resource, per turn). Ships always need a space yard.
base_colony_rate = 100

[ships]
# Every ship design must include components with these abilities.
required_abilities = ["command", "life_support", "crew_quarters"]

[combat]
rounds = 10
