# Builds the release packages for a version tag (v*) with tools/package_release.sh
# and keeps them as workflow artifacts (docs/BUILDING.md, "Release packages").
# It publishes nothing: the owner downloads the artifacts and makes the release.
#
# Third-party actions are pinned to a full commit SHA; the comment names the tag.

name: Release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # x86_64 and aarch64, each natively on its own runner.
  linux:
    name: Linux package (${{ matrix.arch }})
    runs-on: ${{ matrix.image }}
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - arch: x86_64
            image: ubuntu-26.04
          - arch: aarch64
            image: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # SDL3 is built into the game: its build needs the headers of every
      # windowing and audio system it can use, as listed in SDL's README-linux.md.
      # SDL loads those libraries at run time, so players need none of them.
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslc pkg-config \
            libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl-dev \
            libgles-dev libegl-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev \
            libusb-1.0-0-dev libpipewire-0.3-dev libwayland-dev wayland-protocols \
            libdecor-0-dev liburing-dev desktop-file-utils appstream

      - name: Build, test and package
        run: tools/package_release.sh linux

      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # 32-bit ARM (armhf: ARMv7, hard-float, NEON), cross-compiled on x86_64 with
  # Ubuntu's arm-linux-gnueabihf GCC; the tests run under QEMU. SDL3's build
  # needs the same headers and libraries as above, for armhf: Ubuntu's ports
  # archive has them, installed next to the amd64 packages (multiarch). In a
  # clean Ubuntu container: the runner's own packages are newer than the
  # archive's, and the armhf ones must have the same versions.
  linux-armhf:
    name: Linux package (armhf)
    runs-on: ubuntu-26.04
    container: ubuntu:26.04@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7
    timeout-minutes: 60
    steps:
      # The archive serves amd64; the ports archive serves armhf.
      - name: Add the armhf architecture
        run: |
          . /etc/os-release
          sed -i '/^Types:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' 'Types: deb' 'URIs: http://ports.ubuntu.com/ubuntu-ports' \
            "Suites: $VERSION_CODENAME $VERSION_CODENAME-updates $VERSION_CODENAME-security" \
            'Components: main universe' 'Architectures: armhf' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' > /etc/apt/sources.list.d/ubuntu-ports.sources
          dpkg --add-architecture armhf

      - name: Install the build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git cmake ninja-build binutils file python3 \
            g++-arm-linux-gnueabihf qemu-user glslc pkg-config desktop-file-utils appstream \
            libasound2-dev:armhf libpulse-dev:armhf libaudio-dev:armhf libfribidi-dev:armhf libjack-dev:armhf \
            libsndio-dev:armhf libx11-dev:armhf libxext-dev:armhf libxrandr-dev:armhf libxcursor-dev:armhf \
            libxfixes-dev:armhf libxi-dev:armhf libxss-dev:armhf libxtst-dev:armhf libxkbcommon-dev:armhf \
            libdrm-dev:armhf libgbm-dev:armhf libgl-dev:armhf libgles-dev:armhf libegl-dev:armhf \
            libdbus-1-dev:armhf libibus-1.0-dev:armhf libudev-dev:armhf libthai-dev:armhf \
            libusb-1.0-0-dev:armhf libpipewire-0.3-dev:armhf libwayland-dev:armhf wayland-protocols \
            libdecor-0-dev:armhf liburing-dev:armhf
          cmake --version | head -1
          arm-linux-gnueabihf-g++ --version | head -1

      # After git is installed, so that the checkout is a repository the script can describe.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build, test and package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tools/package_release.sh linux-armhf

      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-linux-armhf
          path: dist/*.tar.gz
          if-no-files-found: error

  # Cross-built on Linux with the pinned llvm-mingw for msvcrt.dll, as releases are:
  # the programs run on Windows 7 SP1 to 11. The script checks their imports against
  # Windows 7 SP1 and runs the tests under Wine.
  windows:
    name: Windows packages
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslc nsis libarchive-tools wine wine64

      - name: Build, check the imports, test and package
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: tools/package_release.sh windows

      - name: Upload the packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-windows
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  checksums:
    name: Checksums
    needs: [linux, linux-armhf, windows]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Write the checksums
        id: sums
        working-directory: dist
        run: |
          version=$(ls OpenSE4-*-linux-x86_64.tar.gz | sed 's/^OpenSE4-\(.*\)-linux-x86_64\.tar\.gz$/\1/')
          sums=$(sha256sum OpenSE4-"$version"-*)
          echo "$sums" | tee "OpenSE4-$version-SHA256SUMS.txt"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload the release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenSE4-${{ steps.sums.outputs.version }}
          path: dist/OpenSE4-*
          if-no-files-found: error
